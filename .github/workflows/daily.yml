name: Vídeo diario

on:
  schedule:
    # Todos los días a las 17:23 UTC (18:23 en invierno / 19:23 en verano en España).
    # GitHub puede retrasar unos minutos las ejecuciones programadas.
    - cron: "23 17 * * *"
  workflow_dispatch:   # botón "Run workflow" para lanzarlo a mano
    inputs:
      dry_run:
        description: "Solo generar el vídeo, sin publicar (1 = sí)"
        default: "0"

permissions:
  contents: write   # para guardar songs.csv/historial y crear la release del vídeo

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar y publicar
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.1-8b-instant' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE || 'inbox' }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'es-ES-AlvaroNeural' }}
        run: python bot/main.py

      - name: Guardar el vídeo para descargarlo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            output/video.mp4
            output/img*.jpg
          retention-days: 7
          if-no-files-found: ignore

      - name: Guardar progreso en el repositorio
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add songs.csv historial.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Vídeo del $(date +%F)"
          git push || true
